name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# This action authenticates via the CLOUDFLARE_API_TOKEN secret, not GitHub's
# OIDC/Pages integration, so no pages:write / id-token:write permissions are
# needed (see cloudflare/wrangler-action README).
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            home/package-lock.json
            pikgeon/package-lock.json
            babbby/package-lock.json
            sotto/package-lock.json
            dingpos/package-lock.json

      - name: Test Worker + shared scripts
        run: npm test

      - name: Install & build home
        working-directory: home
        run: |
          npm ci
          npm run build

      - name: Install & build pikgeon
        working-directory: pikgeon
        run: |
          npm ci
          npm run build

      - name: Install & build babbby
        working-directory: babbby
        run: |
          npm ci
          npm run build

      - name: Install & build sotto
        working-directory: sotto
        run: |
          npm ci
          npm run build

      - name: Install & build dingpos
        working-directory: dingpos
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/home _site/pikgeon _site/babbby _site/sotto _site/dingpos
          # root-level static files
          cp -r app-ads.txt _site/ 2>/dev/null || true
          cp -r google9c954b37d1869b6e.html _site/ 2>/dev/null || true
          cp -r robots.txt _site/ 2>/dev/null || true
          cp -r sitemap.xml _site/ 2>/dev/null || true
          cp -r llms.txt _site/ 2>/dev/null || true
          # root index: canonical-only fallback. The Worker (src/worker.js)
          # issues the real "/" -> "/home/" redirect before this file's body
          # is reached in normal browsing; this only serves the literal
          # /index.html path, which Cloudflare's default html_handling
          # normalizes back to "/" anyway.
          cp index.html _site/index.html
          # 404: static body only, no client-side redirect logic. The Worker
          # serves this with a real 404 status for any unmatched path — every
          # sub-app route already has a real HTML file (see src/worker.js).
          cp 404.html _site/404.html
          # home build output
          cp -r home/dist/* _site/home/
          # pikgeon build output
          cp -r pikgeon/dist/* _site/pikgeon/
          # babbby build output
          cp -r babbby/dist/* _site/babbby/
          # sotto build output
          cp -r sotto/dist/* _site/sotto/
          # dingpos build output
          cp -r dingpos/dist/* _site/dingpos/

      # Prerender AFTER assemble so every sitemap route ships fully rendered
      # HTML — AI crawlers (GPTBot, ClaudeBot, PerplexityBot...) never execute
      # JS, so the CSR shell is invisible to them (docs/drafts/
      # seo-aeo-optimization.md §2a). An empty render fails the build instead
      # of silently deploying an empty shell.
      - name: Cache Puppeteer Chrome
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Prerender routes
        run: |
          npm ci
          node scripts/prerender.mjs --site-dir _site

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # MUST be pinned. wrangler-action@v3's own default is wrangler
          # 3.90.0, which predates wrangler.jsonc support and fails with
          # "Missing entry-point" because it cannot read this repo's
          # wrangler.jsonc at all. Keep this in the 4.x line, matching the
          # `wrangler` devDependency in the root package.json.
          wranglerVersion: "4"
