name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: pikgeon/package-lock.json

      - name: Install & build pikgeon
        working-directory: pikgeon
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: |
          mkdir -p _site/pikgeon
          # root-level static files
          cp -r app-ads.txt _site/ 2>/dev/null || true
          # pikgeon build output
          cp -r pikgeon/dist/* _site/pikgeon/
          # SPA fallback: copy 404.html to root for GitHub Pages
          cp pikgeon/dist/404.html _site/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
