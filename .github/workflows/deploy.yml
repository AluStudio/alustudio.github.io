name: Deploy to Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

# This action authenticates via the CLOUDFLARE_API_TOKEN secret, not GitHub's
# OIDC/Pages integration, so no pages:write / id-token:write permissions are
# needed (see cloudflare/wrangler-action README).
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            home/package-lock.json
            pikgeon/package-lock.json
            babbby/package-lock.json
            sotto/package-lock.json
            dingpos/package-lock.json

      # Puppeteer downloads its own Chromium (~150MB) on install; without this
      # cache every deploy re-downloads it.
      - name: Cache Puppeteer browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/puppeteer
          key: puppeteer-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install root tooling (prerender + tests)
        run: npm ci

      - name: Test Worker + shared scripts
        run: npm test

      - name: Install & build home
        working-directory: home
        run: |
          npm ci
          npm run build

      - name: Install & build pikgeon
        working-directory: pikgeon
        run: |
          npm ci
          npm run build

      - name: Install & build babbby
        working-directory: babbby
        run: |
          npm ci
          npm run build

      - name: Install & build sotto
        working-directory: sotto
        run: |
          npm ci
          npm run build

      - name: Install & build dingpos
        working-directory: dingpos
        run: |
          npm ci
          npm run build

      - name: Assemble site
        run: node scripts/assemble-site.mjs

      # Every app is a client-side-rendered SPA, so its shipped HTML has an
      # empty #root. AI crawlers do not execute JavaScript, so without this
      # step they index a blank page. Fails the build if any sitemap route
      # renders empty, loses its language, or 404s a resource.
      - name: Prerender sitemap routes to static HTML
        run: node scripts/prerender.mjs

      # Cross-route invariants prerender cannot see from a single route:
      # unique titles, no route inheriting the app homepage's description,
      # canonical matching the route.
      - name: Verify cross-route SEO invariants
        run: node scripts/verify-seo.mjs

      - name: Deploy to Cloudflare
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # MUST be pinned. wrangler-action@v3's own default is wrangler
          # 3.90.0, which predates wrangler.jsonc support and fails with
          # "Missing entry-point" because it cannot read this repo's
          # wrangler.jsonc at all. Keep this in the 4.x line, matching the
          # `wrangler` devDependency in the root package.json.
          wranglerVersion: "4"
