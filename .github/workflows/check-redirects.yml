name: Check old-domain redirect (301)

# Monitors that alustudio.github.io/* still 301s (path/query-preserving) to
# alu-studio.com/*. This is GitHub Pages' own custom-domain redirect
# behavior — it is UNDOCUMENTED per GitHub's official support commitment
# (which only covers "DNS correctly points at GitHub"; once alu-studio.com's
# DNS points at Cloudflare instead, github.io -> custom-domain redirect is
# not a guaranteed-forever behavior). See docs/drafts/cloudflare-migration.md
# Phase 3 for the full rationale.
#
# IMPORTANT — this check only becomes meaningful AFTER Phase 3's live domain
# cutover (GitHub Pages custom domain set to alu-studio.com on this repo).
# Before cutover, alustudio.github.io still serves its original content
# directly with no redirect at all, so this check is EXPECTED to fail — that
# is by design, not a regression, and the workflow intentionally does not go
# red for it (see the MIGRATION_CUTOVER_DONE gate below; avoids alert
# fatigue on a known, expected pre-cutover state).
#
# To arm this check for real once cutover has happened: add a repository
# variable named MIGRATION_CUTOVER_DONE with value "true"
# (Settings -> Secrets and variables -> Actions -> Variables tab). From then
# on a redirect failure is a genuine regression and the workflow fails loud.

on:
  schedule:
    - cron: "0 6 1 * *" # 06:00 UTC on the 1st of every month
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  check-redirects:
    runs-on: ubuntu-latest
    steps:
      - name: Assert representative old-domain URLs 301 to the new domain
        env:
          CUTOVER_DONE: ${{ vars.MIGRATION_CUTOVER_DONE }}
        run: |
          set -u

          # old_urls[i] -> expected_targets[i], written WITHOUT a scheme.
          #
          # Scheme is deliberately excluded from the comparison: GitHub Pages
          # emits `Location: http://alu-studio.com/...` (plaintext) because it
          # cannot issue an https Location for a domain whose DNS it does not
          # control. That is expected and unavoidable. The Worker then upgrades
          # http -> https on the next hop, so what actually matters is checked
          # in two separate assertions below:
          #   (a) first hop is a 301 preserving host+path+query  -> SEO weight
          #   (b) the FINAL landing URL is https and returns 200 -> no plaintext
          #       dead end, and no contradiction with the page's https canonical
          # Asserting an exact `https://...` Location here would fail forever
          # against correct production behavior.
          #
          # Parallel indexed arrays, not an associative array, so this also
          # runs on bash 3.2 (e.g. for local testing on macOS).
          CANONICAL_HOST="alu-studio.com"

          old_urls=(
            "https://alustudio.github.io/"
            "https://alustudio.github.io/pikgeon/privacy?x=1"
            "https://alustudio.github.io/sotto/terms/"
          )
          expected_targets=(
            "alu-studio.com/"
            "alu-studio.com/pikgeon/privacy?x=1"
            "alu-studio.com/sotto/terms/"
          )

          failed=0
          for i in "${!old_urls[@]}"; do
            old_url="${old_urls[$i]}"
            expected="${expected_targets[$i]}"
            echo "::group::$old_url"

            headers=$(curl -sS -I --max-time 15 "$old_url") || {
              echo "curl request itself failed"
              failed=1
              echo "::endgroup::"
              continue
            }

            status=$(echo "$headers" | head -n 1 | awk '{print $2}')
            location=$(echo "$headers" | grep -i "^location:" | tail -n 1 | sed 's/^[Ll]ocation:[[:space:]]*//' | tr -d '\r\n')
            # Strip the scheme before comparing — see the note above.
            location_target="${location#http://}"
            location_target="${location_target#https://}"

            # (b) follow the whole chain to wherever a real visitor ends up.
            final=$(curl -sS -o /dev/null -L --max-time 25 -w '%{url_effective}|%{http_code}' "$old_url" 2>/dev/null) || final="|000"
            final_url="${final%|*}"
            final_code="${final##*|}"

            # Extract the landing hostname. Checking only for an https://
            # prefix would accept ANY https host, so a misconfigured route
            # or a hijacked hop could pass silently. Path is deliberately
            # not compared here (trailing-slash normalization and / -> /home/
            # are both legitimate), but the host must be exact.
            final_host="${final_url#https://}"
            final_host="${final_host#http://}"
            final_host="${final_host%%/*}"

            echo "status=$status"
            echo "location=$location"
            echo "location_target=$location_target"
            echo "expected_target=$expected"
            echo "final_url=$final_url (code=$final_code, host=$final_host)"

            if [[ "$status" != "301" ]]; then
              echo "FAIL: first hop should be 301 (SEO weight transfer), got $status"
              failed=1
            elif [[ "$location_target" != "$expected" ]]; then
              echo "FAIL: host/path/query not preserved — expected '$expected', got '$location_target'"
              failed=1
            elif [[ "$final_url" != https://* ]]; then
              echo "FAIL: chain ends on a non-https URL ('$final_url') — visitors would terminate on plaintext while the page canonical declares https"
              failed=1
            elif [[ "$final_host" != "$CANONICAL_HOST" ]]; then
              echo "FAIL: chain ended on host '$final_host', expected '$CANONICAL_HOST' — the old domain must land on the canonical host, nowhere else"
              failed=1
            elif [[ "$final_code" != "200" ]]; then
              echo "FAIL: chain ends with HTTP $final_code, expected 200"
              failed=1
            else
              echo "OK"
            fi
            echo "::endgroup::"
          done

          if [[ "$failed" -eq 1 ]]; then
            if [[ "$CUTOVER_DONE" == "true" ]]; then
              echo "::error::Old-domain redirect check failed AFTER cutover (MIGRATION_CUTOVER_DONE=true) — this is a real regression, not the expected pre-cutover state."
              exit 1
            else
              echo "::warning::Old-domain redirect check failed, but MIGRATION_CUTOVER_DONE is not 'true' yet — expected pre-cutover state (alustudio.github.io still serves its original content directly, no redirect configured). Not failing the workflow. Set the MIGRATION_CUTOVER_DONE repo variable to 'true' once Phase 3's cutover is live to arm this check for real."
              exit 0
            fi
          fi

          echo "All checked URLs correctly 301 to alu-studio.com."
